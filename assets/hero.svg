<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" fill="none" role="img" aria-label="Robert Wyszywany — Full-Stack Developer &amp; Reverse Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13141F" />
      <stop offset="55%" stop-color="#1A1B26" />
      <stop offset="100%" stop-color="#161722" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7AA2F7" />
      <stop offset="100%" stop-color="#BB9AF7" />
    </linearGradient>
    <linearGradient id="glowOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#7AA2F7" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="214" rx="14" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', monospace; }
    .pulse { animation: pulseAnim 2.4s ease-in-out infinite; }
    .line1 { opacity: 0; animation: cycle1 12s ease-in-out infinite; }
    .line2 { opacity: 0; animation: cycle2 12s ease-in-out infinite; }
    .line3 { opacity: 0; animation: cycle3 12s ease-in-out infinite; }

    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes cycle1 {
      0%, 2% { opacity: 0; transform: translateY(4px); }
      6%, 28% { opacity: 1; transform: translateY(0); }
      32%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes cycle2 {
      0%, 33% { opacity: 0; transform: translateY(4px); }
      38%, 61% { opacity: 1; transform: translateY(0); }
      65%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes cycle3 {
      0%, 66% { opacity: 0; transform: translateY(4px); }
      71%, 94% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-4px); }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Card background -->
    <rect x="1" y="1" width="898" height="214" rx="14" fill="url(#bgGrad)" />
    <rect x="1" y="1" width="898" height="214" fill="url(#grid)" />
    <circle cx="790" cy="65" r="170" fill="url(#glowOrb)" />

    <!-- Top window bar -->
    <rect x="1" y="1" width="898" height="38" fill="#10111A" />
    <line x1="1" y1="39" x2="899" y2="39" stroke="#24283B" stroke-width="1" />
    <rect x="1" y="1" width="898" height="2.5" fill="url(#accentBar)" />

    <!-- Traffic lights -->
    <circle cx="24" cy="20" r="5.5" fill="#F7768E" />
    <circle cx="42" cy="20" r="5.5" fill="#E0AF68" />
    <circle cx="60" cy="20" r="5.5" fill="#9ECE6A" />

    <!-- Terminal title -->
    <text x="450" y="24" text-anchor="middle" class="mono" font-size="12" fill="#565F89">ezzykills@workstation:~/engineering</text>

    <!-- Status indicator -->
    <rect x="758" y="10" width="108" height="20" rx="10" fill="#1A2230" stroke="#2A3B4C" stroke-width="1" />
    <circle cx="772" cy="20" r="3.8" fill="#9ECE6A" class="pulse" />
    <text x="783" y="24" class="mono" font-size="10.5" font-weight="600" fill="#9ECE6A">ACTIVE BUILD</text>

    <!-- Main Heading -->
    <text x="34" y="88" class="sans" font-size="31" font-weight="800" fill="#F8FAFC" letter-spacing="-0.4">⚡ Robert Wyszywany</text>

    <!-- Handle Pill (right-aligned to grid) -->
    <rect x="754" y="65" width="112" height="28" rx="7" fill="#1F2335" stroke="#3B4261" stroke-width="1" />
    <text x="810" y="83" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#7DCFFF">@EzzyKillS</text>

    <!-- Subtitle -->
    <text x="36" y="118" class="sans" font-size="14.5" font-weight="500" fill="#A9B1D6">
      Full-Stack &amp; Mobile Engineer
      <tspan fill="#565F89" dx="6">•</tspan>
      <tspan fill="#7AA2F7" dx="6">CS2 Market Intelligence</tspan>
      <tspan fill="#565F89" dx="6">•</tspan>
      <tspan fill="#BB9AF7" dx="6">Game Modding &amp; Reverse Engineering</tspan>
    </text>

    <!-- Terminal Prompt Box -->
    <rect x="34" y="140" width="832" height="50" rx="9" fill="#0F1018" stroke="#24283B" stroke-width="1" />
    <text x="52" y="170" class="mono" font-size="13.5" font-weight="700" fill="#9ECE6A">➜</text>
    <text x="72" y="170" class="mono" font-size="13.5" font-weight="600" fill="#7DCFFF">focus</text>
    <text x="120" y="170" class="mono" font-size="13.5" fill="#565F89">--live</text>

    <!-- Animated Rotating Lines -->
    <g class="line1">
      <text x="180" y="170" class="mono" font-size="13.5" fill="#C0CAF5">
        Architecting <tspan fill="#00E5FF" font-weight="600">EzzyTracker</tspan> — Multi-Market CS2 Portfolio, Alerts &amp; Live Widgets
      </text>
    </g>
    <g class="line2">
      <text x="180" y="170" class="mono" font-size="13.5" fill="#C0CAF5">
        Maintaining <tspan fill="#BB9AF7" font-weight="600">ValheimTooler 1.0+</tspan> — Unity / Mono Runtime Patching &amp; HarmonyLib
      </text>
    </g>
    <g class="line3">
      <text x="180" y="170" class="mono" font-size="13.5" fill="#C0CAF5">
        Computer Science Student — <tspan fill="#7AA2F7" font-weight="600">Clean Architecture, Real-Time Feeds &amp; Low-Level Systems</tspan>
      </text>
    </g>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="1" y="1" width="898" height="214" rx="14" stroke="#292E42" stroke-width="1.2" />
</svg>
